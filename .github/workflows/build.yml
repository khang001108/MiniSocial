name: MiniSocial build verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java 17 server
        run: sh server/build.sh
      - name: Build Nokia E72 JAR / JAD
        run: python3 client/build_j2me.py
      - name: Check username accounts, admin controls and onboarding (mock Supabase)
        run: |
          python3 tests/test_admin_username.py
          python3 tests/test_onboarding_device.py
      - name: Test Nokia form navigation and layout
        run: |
          mkdir -p client/build/tests
          javac --release 8 -encoding UTF-8 -cp client/lib-stubs/midp2-compile-only.jar:client/build/classes -d client/build/tests tests/*.java
          for test in LoginFormSmoke RegistrationFormSmoke ServerSelectionSmoke ResponsiveLayoutSmoke PasswordFormsSmoke OnboardingSmoke; do
            java -cp client/lib-stubs/midp2-compile-only.jar:client/build/classes:client/build/tests "$test"
          done
      - name: Validate JAR format
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('client/dist/MiniSocial-Responsive.jar') as z:
              classes=[x for x in z.namelist() if x.endswith('.class')]
              assert classes
              for cls in classes:
                  b=z.read(cls)
                  assert b[:4]==b'\xca\xfe\xba\xbe'
                  assert b[6:8]==b'\x00\x2d', cls
                  assert b'java/lang/StringBuilder' not in b, cls
              print('Verified class version 45:',len(classes))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minisocial-java-me-and-server
          path: |
            client/dist/*.jar
            client/dist/*.jad
            server/build/minisocial-server.jar
